name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/mapcolor-turf-war-setup-v90g5h]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo on the first run, so there is no
          # settings click needed before this workflow can deploy.
          enablement: true
      # The site is plain static files — web/ is published as-is, no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
