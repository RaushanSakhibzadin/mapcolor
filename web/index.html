<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>mapcolor — Beograd turf war</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="8" height="8" fill="%23ff3b30"/><rect x="8" y="8" width="8" height="8" fill="%230a84ff"/></svg>' />
<link rel="stylesheet" href="https://esm.sh/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #10131a; color: #e7e9ee;
    font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; overscroll-behavior: none; }
  #map { position: absolute; inset: 0; }
  #map::after { content: ""; position: absolute; inset: auto 0 0 0; height: 4px;
    background: var(--team, transparent); pointer-events: none; z-index: 2; }
  .hud { position: absolute; z-index: 3; }
  #top { top: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: baseline;
    padding: 10px 56px 10px 14px; background: linear-gradient(#10131aee, #10131a00); }
  #top b { font-size: 15px; letter-spacing: .02em; }
  #mode { font-size: 12px; opacity: .75; }
  #status { font-size: 12px; opacity: .6; margin-left: auto; text-align: right;
    text-decoration: underline dotted; cursor: pointer; }
  #status.bad { opacity: 1; color: #ff6b60; }
  #teams { left: 0; right: 0; bottom: 0; display: flex; justify-content: center;
    gap: 8px; padding: 12px calc(12px + env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
  #teams button { border: 2px solid #ffffff22; border-radius: 999px; padding: 9px 16px;
    color: #10131a; font: 600 14px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
  #teams button span { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 6px; }
  #teams button.active { border-color: #fff; box-shadow: 0 0 0 3px #ffffff22; }
  #log { position: absolute; inset: 0; z-index: 4; display: none; flex-direction: column;
    background: #0b0d12f2; padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
  #log.open { display: flex; }
  #log-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  #log-actions button { background: #232838; color: #e7e9ee; border: 1px solid #ffffff22;
    border-radius: 8px; padding: 9px 14px; font: 600 13px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
  #log-text { flex: 1; margin: 0; overflow: auto; white-space: pre-wrap; word-break: break-word;
    font: 12px/1.5 ui-monospace, monospace; background: #0b0d12; border: 1px solid #ffffff14;
    border-radius: 8px; padding: 10px; color: #cfd4e0; -webkit-user-select: text; user-select: text; }
</style>

<script>
// Boot log. Deliberately inline, dependency-free and first on the page: if the
// module below never loads (bad CDN, blocked script, syntax error on an old
// browser) this is the only thing left running, and it is exactly the case
// where "nothing happened" needs explaining.
(function () {
  var entries = (window.__mcLog = []);
  var booted = false;

  function add(line) {
    entries.push({ t: Math.round(performance.now()), line: line });
    render();
  }
  function fail(line) {
    add(line);
    var status = document.getElementById("status");
    if (status) { status.textContent = line.slice(0, 60) + " — tap for log"; status.className = "bad"; }
  }
  window.__mcBooted = function () { booted = true; };

  addEventListener("error", function (e) {
    // Resource errors (a script/stylesheet that 404s) have no message.
    fail(e.message
      ? "js error: " + e.message + " @ " + (e.filename || "?") + ":" + e.lineno
      : "failed to load: " + (e.target && (e.target.src || e.target.href) || "?"));
  }, true);
  addEventListener("unhandledrejection", function (e) {
    fail("unhandled rejection: " + ((e.reason && (e.reason.message || e.reason)) || "?"));
  });

  add("boot " + location.href);
  add("ua " + navigator.userAgent);
  add("screen " + innerWidth + "x" + innerHeight + " dpr" + (devicePixelRatio || 1));
  try { localStorage.setItem("__mc", "1"); localStorage.removeItem("__mc"); add("localStorage ok"); }
  catch (e) { add("localStorage blocked: " + e.message); }

  // If the module never gets as far as creating a map, say so rather than
  // sitting on a dead page.
  setTimeout(function () {
    if (!booted) fail("boot timeout: the app script never started");
  }, 10000);

  function text() {
    return entries.map(function (e) { return "[" + e.t + "ms] " + e.line; }).join("\n");
  }
  function render() {
    var pre = document.getElementById("log-text");
    if (pre) pre.textContent = text();
  }
  window.__mcRender = render;

  addEventListener("DOMContentLoaded", function () {
    var panel = document.getElementById("log");
    document.getElementById("status").onclick = function () { render(); panel.classList.add("open"); };
    document.getElementById("log-close").onclick = function () { panel.classList.remove("open"); };
    document.getElementById("log-copy").onclick = function () {
      navigator.clipboard.writeText(text()).then(
        function () { document.getElementById("log-copy").textContent = "copied"; },
        function (e) { add("clipboard blocked: " + e.message); });
    };
    document.getElementById("log-download").onclick = function () {
      var url = URL.createObjectURL(new Blob([text()], { type: "text/plain" }));
      var a = document.createElement("a");
      a.href = url;
      a.download = "mapcolor-log.txt";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    };
    render();
  });
})();
</script>

<div id="map"></div>
<div class="hud" id="top">
  <b>mapcolor</b>
  <span id="mode"></span>
  <span id="status">starting…</span>
</div>
<div class="hud" id="teams"></div>
<div id="log">
  <div id="log-actions">
    <button id="log-copy" type="button">copy</button>
    <button id="log-download" type="button">download</button>
    <button id="log-close" type="button">close</button>
  </div>
  <pre id="log-text"></pre>
</div>
<script type="module" src="./src/index.js"></script>
